<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Golden Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Building Gradient -->
    <linearGradient id="bldgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>

  <!-- Top Badge: IC 2026 -->
  <g transform="translate(256, 76)" text-anchor="middle">
    <rect x="-96" y="-22" width="192" height="40" rx="20" fill="#0f172a" fill-opacity="0.6" stroke="url(#goldGrad)" stroke-width="2"/>
    <text y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#fbbf24" letter-spacing="3">IC 2026</text>
  </g>

  <!-- Central Hotel & Rooming Graphic with Shadow -->
  <g filter="url(#shadow)" transform="translate(0, 8)">
    <!-- Back Tall Tower -->
    <rect x="290" y="160" width="100" height="210" rx="8" fill="#94a3b8" opacity="0.85"/>
    <!-- Back Tower Windows -->
    <rect x="306" y="180" width="16" height="18" rx="3" fill="#38bdf8" opacity="0.9"/>
    <rect x="334" y="180" width="16" height="18" rx="3" fill="#38bdf8" opacity="0.9"/>
    <rect x="362" y="180" width="16" height="18" rx="3" fill="#38bdf8" opacity="0.9"/>
    <rect x="306" y="212" width="16" height="18" rx="3" fill="#38bdf8" opacity="0.9"/>
    <rect x="334" y="212" width="16" height="18" rx="3" fill="#fde047" opacity="0.9"/>
    <rect x="362" y="212" width="16" height="18" rx="3" fill="#38bdf8" opacity="0.9"/>
    <rect x="306" y="244" width="16" height="18" rx="3" fill="#38bdf8" opacity="0.9"/>
    <rect x="334" y="244" width="16" height="18" rx="3" fill="#38bdf8" opacity="0.9"/>
    <rect x="362" y="244" width="16" height="18" rx="3" fill="#fde047" opacity="0.9"/>

    <!-- Main Front Hotel Building -->
    <rect x="122" y="130" width="180" height="240" rx="12" fill="url(#bldgGrad)"/>

    <!-- Building Crown Accent -->
    <rect x="152" y="112" width="120" height="18" rx="6" fill="url(#goldGrad)"/>

    <!-- Main Windows Grid (Warm glowing hospitality light) -->
    <!-- Row 1 -->
    <rect x="146" y="152" width="28" height="24" rx="4" fill="#1e3a8a"/>
    <rect x="186" y="152" width="28" height="24" rx="4" fill="#fbbf24"/>
    <rect x="226" y="152" width="28" height="24" rx="4" fill="#1e3a8a"/>
    <rect x="258" y="152" width="28" height="24" rx="4" fill="#fbbf24"/>

    <!-- Row 2 -->
    <rect x="146" y="190" width="28" height="24" rx="4" fill="#38bdf8"/>
    <rect x="186" y="190" width="28" height="24" rx="4" fill="#1e3a8a"/>
    <rect x="226" y="190" width="28" height="24" rx="4" fill="#fbbf24"/>
    <rect x="258" y="190" width="28" height="24" rx="4" fill="#38bdf8"/>

    <!-- Row 3 -->
    <rect x="146" y="228" width="28" height="24" rx="4" fill="#fbbf24"/>
    <rect x="186" y="228" width="28" height="24" rx="4" fill="#38bdf8"/>
    <rect x="226" y="228" width="28" height="24" rx="4" fill="#1e3a8a"/>
    <rect x="258" y="228" width="28" height="24" rx="4" fill="#fbbf24"/>

    <!-- Row 4 -->
    <rect x="146" y="266" width="28" height="24" rx="4" fill="#1e3a8a"/>
    <rect x="186" y="266" width="28" height="24" rx="4" fill="#fbbf24"/>
    <rect x="226" y="266" width="28" height="24" rx="4" fill="#38bdf8"/>
    <rect x="258" y="266" width="28" height="24" rx="4" fill="#1e3a8a"/>

    <!-- Hotel Canopy / Entrance -->
    <path d="M 180,330 L 244,330 L 252,370 L 172,370 Z" fill="#1e293b"/>
    <rect x="170" y="322" width="84" height="10" rx="3" fill="url(#goldGrad)"/>
    <rect x="194" y="340" width="36" height="30" rx="4" fill="#fbbf24" opacity="0.95"/>
  </g>

  <!-- Key Overlay Badge (Signifying Keyman / Rooming) -->
  <g transform="translate(356, 316) rotate(-25)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="32" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3"/>
    <circle cx="0" cy="0" r="14" fill="#0f172a"/>
    <rect x="-6" y="28" width="12" height="42" rx="4" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="2"/>
    <rect x="4" y="44" width="14" height="8" rx="2" fill="url(#goldGrad)"/>
    <rect x="4" y="58" width="18" height="8" rx="2" fill="url(#goldGrad)"/>
  </g>

  <!-- Bottom Title: ROOMING -->
  <g transform="translate(256, 436)" text-anchor="middle">
    <text y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="6">ROOMING</text>
    <text y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#93c5fd" letter-spacing="3">VOLUNTEER ASSISTANT</text>
  </g>
</svg>

